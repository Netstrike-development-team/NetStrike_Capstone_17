# Canonical NetStrike v1 events: one sorted-key JSON object per line, up to
# 256 KiB. Index-time JSON extraction is configured on the forwarder (see
# forwarder/netstrike_app_events_inputs); this stanza covers the indexer side.
[netstrike:event:v1]
SHOULD_LINEMERGE = false
TRUNCATE = 300000
TZ = UTC
KV_MODE = none
AUTO_KV_JSON = false

# Separate fact-only simulated application audits, not Windows/vendor logs.
[netstrike:learner:audit:v1]
SHOULD_LINEMERGE = false
TRUNCATE = 300000
TZ = UTC
KV_MODE = none
AUTO_KV_JSON = false
