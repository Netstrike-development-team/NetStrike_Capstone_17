# Staff-only searches. Field names for Windows XML events are extracted with
# rex because no Windows add-on is assumed; validate them against live events.

# ---------------------------------------------------------------- data health

[NetStrike Health - Source freshness]
description = Latest event time and count per expected source. MISSING/STALE for a required source must be cleared before participants enter.
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4
counttype = number of events
search = | union \
    [ search `netstrike_staff_events` | eval source_id='source.component' | stats count latest(_time) as last_event_time by source_id ] \
    [ search `netstrike_host_events` | `netstrike_host_source_id` | stats count latest(_time) as last_event_time by source_id ] \
| inputlookup append=t netstrike_expected_sources \
| stats sum(count) as events max(last_event_time) as last_event_time max(required) as required max(max_age_seconds) as max_age_seconds max(class) as class by source_id \
| eval age_seconds=now()-last_event_time \
| eval status=case(isnull(max_age_seconds),"UNMAPPED", isnull(last_event_time) AND required=1,"MISSING", isnull(last_event_time),"NOT_SEEN", age_seconds>max_age_seconds AND required=1,"STALE", age_seconds>max_age_seconds,"IDLE", true(),"OK") \
| eval last_event=strftime(last_event_time,"%Y-%m-%d %H:%M:%S") \
| where status IN ("MISSING","STALE") \
| table source_id class required events last_event age_seconds max_age_seconds status

[NetStrike Health - Source overview]
description = Same data as the freshness alert, listing every source regardless of status.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = | union \
    [ search `netstrike_staff_events` | eval source_id='source.component' | stats count latest(_time) as last_event_time by source_id ] \
    [ search `netstrike_host_events` | `netstrike_host_source_id` | stats count latest(_time) as last_event_time by source_id ] \
| inputlookup append=t netstrike_expected_sources \
| stats sum(count) as events max(last_event_time) as last_event_time max(required) as required max(max_age_seconds) as max_age_seconds by source_id \
| eval age_seconds=now()-last_event_time \
| eval status=case(isnull(max_age_seconds),"UNMAPPED", isnull(last_event_time) AND required=1,"MISSING", isnull(last_event_time),"NOT_SEEN", age_seconds>max_age_seconds AND required=1,"STALE", age_seconds>max_age_seconds,"IDLE", true(),"OK") \
| eval last_event=strftime(last_event_time,"%Y-%m-%d %H:%M:%S") \
| table source_id required events last_event age_seconds max_age_seconds status \
| sort status source_id

[NetStrike Health - Event counts by run and source]
description = Application event counts per exercise/run and source component.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `netstrike_staff_events` \
| stats count min(sequence) as first_sequence max(sequence) as last_sequence by exercise_id run_id source.component \
| sort exercise_id run_id source.component

[NetStrike Health - Host clock skew]
description = Index time minus event time per host and source. Large positive or negative skew indicates NTP or forwarder delay problems.
dispatch.earliest_time = -60m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 3
counttype = number of events
search = `netstrike_host_events` \
| `netstrike_host_source_id` \
| eval skew_seconds=_indextime-_time \
| stats count avg(skew_seconds) as avg_skew p95(skew_seconds) as p95_skew min(skew_seconds) as min_skew max(skew_seconds) as max_skew by host source_id \
| where abs(avg_skew) > `netstrike_max_clock_skew_seconds` OR abs(min_skew) > 10*`netstrike_max_clock_skew_seconds` \
| eval avg_skew=round(avg_skew,1), p95_skew=round(p95_skew,1)

[NetStrike Health - Ingestion failures]
description = Forwarder/indexer errors and warnings that indicate dropped, mis-parsed or blocked data.
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 5
counttype = number of events
search = index=_internal sourcetype=splunkd (log_level=ERROR OR log_level=WARN) \
    (component=TcpInputProc OR component=DateParserVerbose OR component=LineBreakingProcessor OR component=AggregatorMiningProcessor OR component=WatchedFile OR component=TailReader OR component=TailingProcessor OR component=JsonLineBreaker OR component=HttpInputDataHandler OR component=IndexProcessor OR component=ArchiveProcessor) \
| stats count latest(_time) as last_seen values(log_level) as log_level by host component \
| eval last_seen=strftime(last_seen,"%Y-%m-%d %H:%M:%S")

[NetStrike Health - Blocked queues]
description = Indexing queues that blocked, a precursor of ingestion delay.
dispatch.earliest_time = -15m
dispatch.latest_time = now
search = index=_internal source=*metrics.log group=queue blocked=true \
| stats count by host name

[NetStrike Health - Duplicate application events]
description = Event IDs indexed more than once (monitor re-read, checkpoint reset or replay). Do not de-duplicate to hide transport faults.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `netstrike_staff_events` \
| stats count values(source) as source_paths by event_id exercise_id run_id \
| where count > 1

[NetStrike Health - Run sequence gaps]
description = Missing or repeated per-run sequence numbers in the application ledger.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `netstrike_staff_events` \
| dedup event_id \
| sort 0 exercise_id run_id sequence \
| streamstats current=f last(sequence) as previous_sequence by exercise_id run_id \
| eval expected=coalesce(previous_sequence,0)+1 \
| where sequence!=expected \
| table exercise_id run_id previous_sequence sequence event_id

[NetStrike Health - Ingestion volume]
description = Daily licence consumption by index against the 10 GB/day cap (alerts at 80 percent).
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 1
cron_schedule = 7 * * * *
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4
counttype = number of events
search = index=_internal source=*license_usage.log type=Usage \
| stats sum(b) as bytes by idx \
| eventstats sum(bytes) as total_bytes \
| eval gb=round(bytes/1024/1024/1024,3), total_gb=round(total_bytes/1024/1024/1024,3), pct_of_limit=round(total_gb/`netstrike_license_limit_gb`*100,1) \
| where pct_of_limit >= 80 \
| table idx gb total_gb pct_of_limit

[NetStrike Health - Ingestion volume by source]
description = Volume by index, sourcetype and host for capacity planning and rehearsal measurement.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
search = index=_internal source=*license_usage.log type=Usage (idx=netstrike OR idx=netstrike_staff) \
| stats sum(b) as bytes by idx st h \
| eval mb=round(bytes/1024/1024,2), pct_of_daily_limit=round(bytes/1024/1024/1024/`netstrike_license_limit_gb`*100,2) \
| sort - bytes

# ----------------------------------------------------------- access separation

[NetStrike Access - Participant index isolation]
description = Must return no rows: canonical application events must never be in the participant-searchable index.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = index=netstrike sourcetype="netstrike:event:v1" \
| stats count

[NetStrike Access - Role definitions]
description = Evidence that the participant role is limited to the netstrike index and the facilitator role includes the staff index.
dispatch.earliest_time = -1m
dispatch.latest_time = now
search = | rest /services/authorization/roles splunk_server=local \
| search title=netstrike_* \
| table title imported_roles srchIndexesAllowed srchIndexesDefault capabilities

# ------------------------------------------------------- run readiness probes

[NetStrike Probe - Run ID by source]
description = Run-ID probe. Open with the run_id token set to the readiness/test run to prove each source is searchable by run ID. Host telemetry carries the run ID as an indexed field set by the forwarder _meta setting (citef-config telemetry roles).
dispatch.earliest_time = -60m
dispatch.latest_time = now
search = (`netstrike_staff_events` run_id="$run_id$") OR (index=netstrike run_id="$run_id$") \
| eval source_id=coalesce('source.component', source) \
| stats count latest(_time) as last_event_time by index source_id \
| eval last_event=strftime(last_event_time,"%Y-%m-%d %H:%M:%S") \
| table index source_id count last_event

# -------------------------------------------------- checkpoint 1 (DP1) guide

[NetStrike Guide - DP1 identity triage evidence]
description = Solution guide. Application-side evidence relevant to the DP1 requirement: affected identity is Sarah, at least three artifacts from at least two sources.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `netstrike_staff_events` run_id="$run_id$" sarah \
    (event_type="identity.fake_sso.submitted" OR event_type="identity.interaction.recorded" OR event_type="helpdesk.identity_reset*" OR event_type="identity.mfa.challenge.*" OR event_type="identity.factor.registered" OR event_type="identity.session.created" OR event_type="identity.authentication.succeeded" OR event_type="endpoint.remote_access.succeeded") \
| sort 0 sequence \
| table _time sequence event_id event_type source.component visibility phase message

[NetStrike Guide - DP1 distinct artifacts and sources]
description = Solution guide. Counts distinct artifacts and sources behind the DP1 candidate evidence, mirroring the evaluator thresholds (3 artifacts, 2 sources).
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `netstrike_staff_events` run_id="$run_id$" sarah \
    (event_type="identity.fake_sso.submitted" OR event_type="helpdesk.identity_reset*" OR event_type="identity.mfa.challenge.*" OR event_type="identity.factor.registered" OR event_type="identity.session.created" OR event_type="identity.authentication.succeeded" OR event_type="endpoint.remote_access.succeeded") \
| stats dc(event_id) as artifacts dc(source.component) as sources values(event_type) as event_types \
| eval artifact_threshold_met=if(artifacts>=3,"yes","no"), source_threshold_met=if(sources>=2,"yes","no")

[NetStrike Guide - DP1 outcome]
description = Solution guide. Recorded controller result for checkpoint DP1.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = `netstrike_staff_events` run_id="$run_id$" checkpoint_id=DP1 event_type="scenario.checkpoint.resolved" \
| table _time sequence event_id outcome.status outcome.reason message

[NetStrike Guide - DP1 workstation telemetry for Sarah]
description = Solution guide. Host telemetry a participant can find for the Sarah/FIN-WS01 activity.
dispatch.earliest_time = -24h
dispatch.latest_time = now
search = index=netstrike sarah (source="*WinEventLog:*") \
| `netstrike_host_source_id` \
| rex field=_raw "<EventID[^>]*>(?<win_event_id>\d+)</EventID>" \
| sort 0 _time \
| table _time host source_id win_event_id
