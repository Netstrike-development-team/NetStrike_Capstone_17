# The participant role deliberately imports nothing: the built-in `user` role
# can search every non-internal index. Access is an explicit allow-list.
[role_netstrike_participant]
srchIndexesAllowed = netstrike
srchIndexesDefault = netstrike
search = enabled
rtsearch = disabled
schedule_search = disabled
srchJobsQuota = 3
rtSrchJobsQuota = 0
srchDiskQuota = 200
srchMaxTime = 5m

[role_netstrike_facilitator]
importRoles = power
srchIndexesAllowed = netstrike;netstrike_staff;_internal
srchIndexesDefault = netstrike;netstrike_staff
schedule_search = enabled
srchJobsQuota = 10
