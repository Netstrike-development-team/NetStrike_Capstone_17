# Retention is the CITEF-approved one day (86400 s). Splunk freezes whole
# buckets only, so hot buckets are capped at one day to make that bound real.
# Size caps keep both indexes well inside the 300 GB disk limit.

# Participant-searchable: Windows/Linux host telemetry only.
[netstrike]
homePath = $SPLUNK_DB/netstrike/db
coldPath = $SPLUNK_DB/netstrike/colddb
thawedPath = $SPLUNK_DB/netstrike/thaweddb
frozenTimePeriodInSecs = 86400
maxHotSpanSecs = 86400
maxHotIdleSecs = 86400
maxTotalDataSizeMB = 51200

# Facilitator-only: the complete canonical application ledger, including
# facilitator/evaluator events and answer labels.
[netstrike_staff]
homePath = $SPLUNK_DB/netstrike_staff/db
coldPath = $SPLUNK_DB/netstrike_staff/colddb
thawedPath = $SPLUNK_DB/netstrike_staff/thaweddb
frozenTimePeriodInSecs = 86400
maxHotSpanSecs = 86400
maxHotIdleSecs = 86400
maxTotalDataSizeMB = 20480
