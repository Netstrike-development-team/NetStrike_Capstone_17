[netstrike_staff_events]
definition = index=netstrike_staff sourcetype="netstrike:event:v1"

# *WinEventLog also matches the XmlWinEventLog source names produced by renderXml=1.
[netstrike_host_events]
definition = index=netstrike (source="*WinEventLog:*" OR sourcetype=linux_syslog OR sourcetype=linux_auth)

[netstrike_host_source_id]
definition = eval source_id=case(like(source,"%WinEventLog:Security"),"windows_security", like(source,"%PowerShell/Operational"),"windows_powershell", like(source,"%Sysmon/Operational"),"windows_sysmon", sourcetype="linux_syslog","linux_syslog", sourcetype="linux_auth","linux_auth", true(),"unmapped:".source)

[netstrike_license_limit_gb]
definition = 10

[netstrike_max_clock_skew_seconds]
definition = 60
