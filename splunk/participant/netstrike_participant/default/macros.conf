[netstrike_win_security]
definition = index=netstrike source="*WinEventLog:Security"

[netstrike_simcorp_audit]
definition = index=netstrike sourcetype="netstrike:learner:audit:v1"

[netstrike_win_powershell]
definition = index=netstrike source="*WinEventLog:Microsoft-Windows-PowerShell/Operational"

[netstrike_win_sysmon]
definition = index=netstrike source="*WinEventLog:Microsoft-Windows-Sysmon/Operational"

[netstrike_win_fields]
definition = rex field=_raw "<EventID[^>]*>(?<event_id_win>\d+)</EventID>" | rex field=_raw "<Data Name='TargetUserName'>(?<target_user>[^<]*)</Data>" | rex field=_raw "<Data Name='SubjectUserName'>(?<subject_user>[^<]*)</Data>" | rex field=_raw "<Data Name='IpAddress'>(?<source_ip>[^<]*)</Data>" | rex field=_raw "<Data Name='LogonType'>(?<logon_type>[^<]*)</Data>"
