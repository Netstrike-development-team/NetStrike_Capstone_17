# Neutral investigation starting points that summarise activity without
# labelling any of it.

[Investigate - SimCorp audit timeline]
description = Simulated application audit facts. Add exercise_id and run_id filters for your assigned exercise.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `netstrike_simcorp_audit` \
| table _time exercise_id run_id event_id service event_type actor_id target_id outcome facts.* \
| sort 0 _time

[Investigate - SimCorp identity activity]
description = Sign-in, session and MFA activity in the simulated identity service.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `netstrike_simcorp_audit` service="simcorp-identity" \
| table _time run_id event_id event_type actor_id target_id outcome facts.* \
| sort 0 _time

[Investigate - SimCorp helpdesk resets]
description = Reset tickets and recorded callback-verification facts.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `netstrike_simcorp_audit` service="simcorp-helpdesk" \
| table _time run_id event_id actor_id target_id facts.ticket_id facts.callback_verified outcome \
| sort 0 _time

[Investigate - SimCorp storage activity]
description = Simulated storage authentication, policy changes and object access.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `netstrike_simcorp_audit` service="simcorp-storage" \
| table _time run_id event_id event_type actor_id target_id outcome facts.* \
| sort 0 _time

[Investigate - Windows logon activity]
description = Successful and failed Windows logons by account, host and source address.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `netstrike_win_security` \
| `netstrike_win_fields` \
| where event_id_win IN ("4624","4625") \
| eval result=if(event_id_win="4624","success","failure") \
| stats count min(_time) as first_seen max(_time) as last_seen by host target_user source_ip logon_type result \
| convert ctime(first_seen) ctime(last_seen) \
| sort - count

[Investigate - Account and group changes]
description = Windows account creation, enablement, password and group-membership events.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `netstrike_win_security` \
| `netstrike_win_fields` \
| where event_id_win IN ("4720","4722","4723","4724","4725","4726","4728","4732","4738","4740") \
| table _time host event_id_win subject_user target_user \
| sort 0 _time

[Investigate - PowerShell activity]
description = PowerShell operational events by host.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `netstrike_win_powershell` \
| rex field=_raw "<EventID[^>]*>(?<event_id_win>\d+)</EventID>" \
| stats count min(_time) as first_seen max(_time) as last_seen by host event_id_win \
| convert ctime(first_seen) ctime(last_seen)

[Investigate - Process creation]
description = Sysmon process creation (event ID 1) with parent process and command line.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = `netstrike_win_sysmon` \
| rex field=_raw "<EventID[^>]*>(?<event_id_win>\d+)</EventID>" \
| where event_id_win="1" \
| rex field=_raw "<Data Name='User'>(?<user>[^<]*)</Data>" \
| rex field=_raw "<Data Name='Image'>(?<image>[^<]*)</Data>" \
| rex field=_raw "<Data Name='ParentImage'>(?<parent_image>[^<]*)</Data>" \
| rex field=_raw "<Data Name='CommandLine'>(?<command_line>[^<]*)</Data>" \
| table _time host user image parent_image command_line \
| sort 0 _time

[Investigate - Host telemetry timeline]
description = Chronological host telemetry across Security, PowerShell and Sysmon for a host or account term. Edit the filter terms to narrow the view.
dispatch.earliest_time = -4h
dispatch.latest_time = now
search = index=netstrike source="*WinEventLog:*" \
| rex field=_raw "<EventID[^>]*>(?<event_id_win>\d+)</EventID>" \
| eval channel=replace(source,"^.*WinEventLog:","") \
| table _time host channel event_id_win \
| sort 0 _time
