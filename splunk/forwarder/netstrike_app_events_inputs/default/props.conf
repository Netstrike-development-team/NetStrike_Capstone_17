# Structured parsing happens on the forwarder. Keys are sorted in the spool, so
# a regex time prefix could hit a nested "timestamp"; the top-level field is
# used instead. Nested objects flatten to dotted fields such as source.component.
[netstrike:event:v1]
INDEXED_EXTRACTIONS = json
TIMESTAMP_FIELDS = timestamp
TZ = UTC
TRUNCATE = 300000

[netstrike:learner:audit:v1]
INDEXED_EXTRACTIONS = json
TIMESTAMP_FIELDS = timestamp
TZ = UTC
TRUNCATE = 300000
