# Monitors only committed batch files. HEAD.json, manifests, .pending-* and
# .head-* are never ingested. The path is a handoff convention from
# docs/event-spool.md; change it to the real spool directory if it differs.
# Use monitor (not the destructive batch input) so the exporter can keep
# verifying retained files. crcSalt makes identical-looking batches at
# different paths distinct; renaming the spool path will re-index it.
[monitor:///var/lib/netstrike/event-spool]
disabled = 0
index = netstrike_staff
sourcetype = netstrike:event:v1
whitelist = /batch-[0-9]{20}-[0-9]{20}/events\.jsonl$
blacklist = /\.(pending|head)-
followSymlink = false
crcSalt = <SOURCE>

# Reviewed SimCorp audit projection only; never point this at the staff spool.
[monitor:///var/lib/netstrike/learner-event-spool]
disabled = 0
index = netstrike
sourcetype = netstrike:learner:audit:v1
whitelist = /batch-[0-9]{20}-[0-9]{20}/events\.jsonl$
blacklist = /\.(pending|head)-
followSymlink = false
crcSalt = <SOURCE>
