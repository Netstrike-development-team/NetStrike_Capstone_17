# Replace token placeholders with distinct random values of at least 32 characters.
# Participant roles: incident_lead, soc_analyst, identity_responder,
# endpoint_responder, cloud_responder. The generic role "participant" is invalid.
controller_service_tokens:
  "<random token 1>":
    actor_id: facilitator-1
    role: facilitator
  "<random token 2>":
    actor_id: soc_analyst-1
    role: soc_analyst
controller_readiness_token: "<random token 1>"
controller_identity_audit_key: "<separate random audit key, 32+ characters>"
ansible_user: test
ansible_password: REPLACE_WITH_SECRET
ansible_become_password: REPLACE_WITH_ROOT_SECRET
ad_safe_mode_password: "<16+ char DSRM password: lower, number, symbol>"
# Required format: DOMAIN\USER. Double-quoted YAML must escape the backslash as \\.
# Example: "SIMCORP\\Administrator" parses as SIMCORP\Administrator.
domain_admin_user: "DOMAIN\\USER"
domain_admin_password: "<16+ char password: lower, number, symbol>"
baseline_user_passwords:
  "exercise.user": "<16+ char password: lower, number, symbol>"

# WinRM credentials for DC01 only; these differ from ansible_user/ansible_password above.
dc01_ansible_user: "<DC01 local administrator account>"
dc01_ansible_password: "REPLACE_WITH_DC01_SECRET"
