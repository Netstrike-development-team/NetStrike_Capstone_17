---
- name: Set the approved Windows computer name
  ansible.windows.win_hostname:
    name: "{{ logical_name }}"
  register: windows_hostname
  when: expected_os_family == "windows"

- name: Restart Windows after a computer name change
  ansible.windows.win_reboot:
    reboot_timeout: 1800
    post_reboot_delay: 30
  when:
    - expected_os_family == "windows"
    - windows_hostname.reboot_required | default(false)

- name: Set the approved Linux host name
  ansible.builtin.hostname:
    name: "{{ logical_name | lower }}"
  when: expected_os_family == "linux"
