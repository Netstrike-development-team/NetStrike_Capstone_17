---
- name: Gather Linux facts
  ansible.builtin.setup:

- name: Require amd64 and systemd on Linux targets
  ansible.builtin.assert:
    that:
      - ansible_facts.system == "Linux"
      - ansible_facts.architecture in ["x86_64", "amd64"]
      - ansible_service_mgr == "systemd"
    fail_msg: "{{ logical_name }} requires an approved amd64 Linux image using systemd."

- name: Require Ubuntu Server 26.04 for CTRL01
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version == "26.04"
    fail_msg: "CTRL01 must use the pinned Ubuntu Server 26.04 LTS baseline."
  when: logical_name == "CTRL01"

- name: Ensure systemd drop-in directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/systemd/resolved.conf.d

- name: Configure internal DNS and exercise search domain
  ansible.builtin.template:
    src: systemd-resolved.conf.j2
    dest: /etc/systemd/resolved.conf.d/60-netstrike.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved

- name: Configure approved NTP sources
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Ensure systemd-resolved is enabled
  ansible.builtin.service:
    name: systemd-resolved
    enabled: true
    state: started

- name: Ensure the system resolver uses systemd-resolved
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

- name: Ensure chrony is enabled
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started

- name: Apply DNS and time changes before verification
  ansible.builtin.meta: flush_handlers

- name: Verify every approved forward DNS record
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ item.dns_name }}"]
  loop: "{{ assets }}"
  register: resolved_hosts
  changed_when: false

- name: Require the DNS response to match each approved address
  ansible.builtin.assert:
    that:
      - item.item.address in item.stdout
    fail_msg: "{{ item.item.dns_name }} does not resolve to its approved address."
  loop: "{{ resolved_hosts.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Require chrony to report synchronized time
  ansible.builtin.command:
    argv: [timedatectl, show, --property=NTPSynchronized, --value]
  register: time_sync_state
  changed_when: false
  retries: 12
  delay: 5
  until: time_sync_state.stdout | trim == "yes"

- name: Confirm chrony selected the approved internal source
  ansible.builtin.command:
    argv: [chronyc, sources]
  register: time_sync_status
  changed_when: false
  failed_when: >-
    (network.ntp_servers | select('in', time_sync_status.stdout) | list | length) == 0

- name: Require Ubuntu 26.04 for the bundled Linux membership packages
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version == "26.04"
    fail_msg: "Linux domain membership packages are bundled for Ubuntu 26.04 amd64."

- name: Remove stale Linux domain package files
  ansible.builtin.file:
    path: /var/cache/netstrike-linux-domain-packages
    state: absent

- name: Stage Linux Active Directory package bundle
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ offline_artifacts.directory }}/netstrike-offline-bundle/destinations/CTRL01/linux-packages/"
    dest: /var/cache/netstrike-linux-domain-packages/
    owner: root
    group: root
    mode: "0644"

- name: Install Linux Active Directory packages without downloading
  ansible.builtin.shell: apt-get --no-download install --yes ./*.deb
  args:
    chdir: /var/cache/netstrike-linux-domain-packages
  register: linux_domain_package_install
  changed_when: "'Setting up ' in linux_domain_package_install.stdout"

- name: Check existing Linux domain membership
  ansible.builtin.command:
    argv: [realm, list, --name-only]
  register: linux_realms
  changed_when: false

- name: Join Linux host to the exercise domain
  ansible.builtin.command:
    argv:
      - realm
      - join
      - --user
      - >-
        {{
          (domain_admin_user | replace('\\', '/') | split('/') | last)
          ~ ('@' ~ identity_baseline.domain_dns_name if '@' not in domain_admin_user else '')
        }}
      - --computer-ou
      - "{{ identity_baseline.search_base_dn }}"
      - --client-software=sssd
      - --membership-software=adcli
      - "{{ identity_baseline.domain_dns_name }}"
    stdin: "{{ domain_admin_password }}"
  when: identity_baseline.domain_dns_name | lower not in (linux_realms.stdout_lines | map('lower') | list)
  no_log: true

- name: Ensure SSSD is enabled and running
  ansible.builtin.service:
    name: sssd
    enabled: true
    state: started

- name: Verify Linux host joined the exercise domain
  ansible.builtin.command:
    argv: [realm, list, --name-only]
  register: joined_linux_realms
  changed_when: false

- name: Require Linux host to be joined to the exercise domain
  ansible.builtin.assert:
    that:
      - identity_baseline.domain_dns_name | lower in (joined_linux_realms.stdout_lines | map('lower') | list)
    fail_msg: "{{ logical_name }} did not join {{ identity_baseline.domain_dns_name }}."
