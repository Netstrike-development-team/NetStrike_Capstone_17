---
- name: Stage the approved Linux Universal Forwarder package
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ offline_artifacts.directory }}/{{ offline_artifacts.universal_forwarder.linux_deb.file }}"
    dest: "/var/tmp/{{ offline_artifacts.universal_forwarder.linux_deb.file | basename }}"
    owner: root
    group: root
    mode: "0600"

- name: Verify staged Linux Universal Forwarder vendor SHA-512
  ansible.builtin.stat:
    path: "/var/tmp/{{ offline_artifacts.universal_forwarder.linux_deb.file | basename }}"
    checksum_algorithm: sha512
  register: linux_uf_sha512

- name: Require the Linux forwarder vendor SHA-512 to match
  ansible.builtin.assert:
    that:
      - linux_uf_sha512.stat.checksum | lower == offline_artifacts.universal_forwarder.linux_deb.sha512 | lower
    fail_msg: "Staged Linux Universal Forwarder package failed SHA-512 verification."

- name: Install Universal Forwarder from the staged local package
  ansible.builtin.apt:
    deb: "/var/tmp/{{ offline_artifacts.universal_forwarder.linux_deb.file | basename }}"
    state: present
    update_cache: false

- name: Create local forwarder configuration directory
  ansible.builtin.file:
    path: /opt/splunkforwarder/etc/system/local
    state: directory
    owner: splunkfwd
    group: splunkfwd
    mode: "0755"

- name: Create local forwarder CA directory
  ansible.builtin.file:
    path: /opt/splunkforwarder/etc/auth/netstrike
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Stage the approved Splunk receiver CA
  when: offline_artifacts.universal_forwarder.receiver_ca is defined
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ offline_artifacts.directory }}/{{ offline_artifacts.universal_forwarder.receiver_ca.file }}"
    dest: /opt/splunkforwarder/etc/auth/netstrike/receiver-ca.pem
    owner: root
    group: root
    mode: "0644"

- name: Verify the staged Linux receiver CA
  when: offline_artifacts.universal_forwarder.receiver_ca is defined
  ansible.builtin.stat:
    path: /opt/splunkforwarder/etc/auth/netstrike/receiver-ca.pem
    checksum_algorithm: sha256
  register: linux_ca

- name: Require the Linux receiver CA hash to match the approved artifact
  when: offline_artifacts.universal_forwarder.receiver_ca is defined
  ansible.builtin.assert:
    that:
      - linux_ca.stat.checksum | lower == offline_artifacts.universal_forwarder.receiver_ca.sha256 | lower
    fail_msg: "Staged receiver CA failed SHA-256 verification."

- name: Configure TLS Splunk receiver output
  ansible.builtin.template:
    src: outputs.conf.j2
    dest: /opt/splunkforwarder/etc/system/local/outputs.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Linux Universal Forwarder

- name: Configure Linux system log collection
  ansible.builtin.template:
    src: inputs.conf.j2
    dest: /opt/splunkforwarder/etc/system/local/inputs.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Linux Universal Forwarder

- name: Allow the forwarder user to read /var/log (adm group)
  ansible.builtin.user:
    name: splunkfwd
    groups: adm
    append: true
  notify: Restart Linux Universal Forwarder

- name: Create the staff group that may read the event spool
  ansible.builtin.group:
    name: "{{ event_spool_group | default('netstrike-staff') }}"
    system: true

- name: Allow the forwarder user to read the event spool (staff group)
  ansible.builtin.user:
    name: splunkfwd
    groups: "{{ event_spool_group | default('netstrike-staff') }}"
    append: true
  notify: Restart Linux Universal Forwarder

- name: Deploy the NetStrike application-event input app to the forwarder
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../splunk/forwarder/netstrike_app_events_inputs/"
    dest: /opt/splunkforwarder/etc/apps/netstrike_app_events_inputs/
    owner: root
    group: splunkfwd
    mode: "0644"
    directory_mode: "0755"
  notify: Restart Linux Universal Forwarder

- name: Check whether the forwarder systemd unit exists
  ansible.builtin.stat:
    path: /etc/systemd/system/SplunkForwarder.service
  register: linux_uf_unit

- name: Register the forwarder as a systemd service
  # `splunk enable boot-start` fails here: systemctl loads Splunk's bundled
  # libcrypto instead of the system OpenSSL, so the unit is written directly.
  when: not linux_uf_unit.stat.exists
  ansible.builtin.copy:
    dest: /etc/systemd/system/SplunkForwarder.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Splunk Universal Forwarder
      After=network.target
      Wants=network.target

      [Service]
      Type=simple
      Restart=always
      ExecStart=/opt/splunkforwarder/bin/splunk _internal_launch_under_systemd --accept-license --no-prompt --answer-yes
      KillMode=mixed
      KillSignal=SIGINT
      TimeoutStopSec=360
      LimitNOFILE=65536
      SuccessExitStatus=51 52
      RestartPreventExitStatus=51
      RestartForceExitStatus=52
      User=splunkfwd
      Group=splunkfwd
      Delegate=true

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start the Linux Universal Forwarder
  ansible.builtin.service:
    name: SplunkForwarder
    enabled: true
    state: started

- name: Apply forwarder configuration changes
  ansible.builtin.meta: flush_handlers
