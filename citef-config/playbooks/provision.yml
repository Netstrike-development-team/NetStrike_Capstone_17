---
- name: Validate approved configuration and offline installation artifacts
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../environment.json"
  tasks:
    - name: Refuse provisioning without a unique deployment identifier
      ansible.builtin.assert:
        that:
          - deployment_id is defined
          - deployment_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$')
        fail_msg: "Pass a unique, path-safe deployment_id (8-64 letters, digits, dots, underscores, or hyphens)."

    - name: Validate the approved environment manifest
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../validate_environment.py"
          - validate
          - --config
          - "{{ playbook_dir }}/../environment.json"
      changed_when: false

    # Windows Server (DC01) is unavailable; re-enable with the DC play below.
    # - name: Require domain bootstrap and membership credentials
    #   ansible.builtin.assert:
    #     that:
    #       - ad_safe_mode_password is defined
    #       - ad_safe_mode_password | length >= 16
    #       - domain_admin_user is defined
    #       - domain_admin_password is defined
    #       - domain_admin_password | length >= 16
    #     fail_msg: "Inject domain bootstrap credentials using the approved Ansible Vault or secret manager."
    #   no_log: true

    - name: Validate all staged vendor artifacts before any host changes
      ansible.builtin.include_tasks: ../tasks/validate_artifacts.yml

- name: Trust SSH host keys of the Linux targets (trust on first use)
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../environment.json"
  tasks:
    - name: Scan ed25519 host keys of Linux assets
      ansible.builtin.command:
        argv: [ssh-keyscan, -t, ed25519, -p, "{{ item.port }}", "{{ item.address }}"]
      loop: "{{ assets | selectattr('os_family', 'equalto', 'linux') | rejectattr('name', 'equalto', 'SPLUNK01') | list }}"
      loop_control:
        label: "{{ item.name }}"
      register: ssh_hostkeys
      changed_when: false
      failed_when: ssh_hostkeys.stdout | length == 0

    - name: Record the scanned host keys in known_hosts
      ansible.builtin.known_hosts:
        name: "{{ item.item.address if item.item.port | int == 22 else '[' ~ item.item.address ~ ']:' ~ item.item.port }}"
        key: "{{ item.item.address if item.item.port | int == 22 else '[' ~ item.item.address ~ ']:' ~ item.item.port }} {{ (item.stdout_lines | reject('match', '^#') | first).split(' ', 1)[1] }}"
        state: present
      loop: "{{ ssh_hostkeys.results }}"
      loop_control:
        label: "{{ item.item.name }}"

# Windows Server (DC01) is unavailable; re-enable when it is.
# - name: Install the domain controller and establish internal DNS/time
