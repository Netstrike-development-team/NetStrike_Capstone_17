- name: Configure domain clients and Windows security telemetry
  hosts: workstations
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../environment.json"
  roles:
    - windows_client

- name: Configure Windows security telemetry on domain hosts
  hosts: windows_hosts:!domain_controllers
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../environment.json"
  roles:
    - windows_telemetry

- name: Configure isolated DNS/time on Linux hosts
  # SPLUNK01 is already provisioned; leave it out of host configuration.
  hosts: linux_hosts:!splunk
  gather_facts: false
  become: true
  # su allocates a pty that merges stderr into module stdout; keep Python warnings out of the JSON stream
  environment:
    PYTHONWARNINGS: ignore
    PYTHONDONTWRITEBYTECODE: "1"
  vars_files:
    - "{{ playbook_dir }}/../environment.json"
  roles:
    - linux_baseline
  tasks:
    - name: Configure Splunk forwarder on the controller host
      ansible.builtin.include_role:
        name: linux_telemetry
      when: logical_name == "CTRL01"
    - name: Deploy the offline controller portal service
      ansible.builtin.include_role:
        name: controller_service
      when: logical_name == "CTRL01"

- name: Check provisioned OS services and baseline readiness
  ansible.builtin.import_playbook: provisioning_validation.yml
