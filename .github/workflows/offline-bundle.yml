name: Build offline bundle

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

env:
  DESTINATION: CTRL01
  PYTHON_VERSION: "3.11.16"
  PYTHON_BUILD: "20260924"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the committed source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bundle builder and Ansible dependencies
        run: |
          python -m pip install pytest -r citef-config/requirements-controller.txt

      - name: Test offline bundle builder
        run: python -m pytest scripts/tests/test_offline_bundle.py scripts/tests/test_offline_smoke.py -q

      - name: Download pinned Ansible collections
        run: |
          mkdir -p "$RUNNER_TEMP/ansible-collections"
          ansible-galaxy collection download \
            --requirements-file citef-config/requirements.yml \
            --download-path "$RUNNER_TEMP/ansible-collections"

      - name: Download portable CPython runtime
        id: runtime
        run: |
          asset="cpython-${PYTHON_VERSION}+${PYTHON_BUILD}-x86_64-unknown-linux-gnu-install_only.tar.gz"
          release="$(curl -fsSL "https://api.github.com/repos/astral-sh/python-build-standalone/releases/tags/${PYTHON_BUILD}")"
          url="$(jq -er --arg asset "$asset" '[.assets[] | select(.name == $asset) | .browser_download_url] | if length == 1 then .[0] else error("runtime asset not found uniquely") end' <<< "$release")"
          curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/python-runtime.tar.gz"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build offline bundle
        env:
          OFFLINE_BUNDLE_DESTINATION: ${{ env.DESTINATION }}
          OFFLINE_BUNDLE_PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          OFFLINE_BUNDLE_PYTHON_URL: ${{ steps.runtime.outputs.url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          requirements=(
            --requirements shared/requirements.txt
            --requirements modules/01-osint-profiler/requirements.txt
            --requirements modules/04-mfa-fatigue-sim/requirements.txt
            --requirements modules/05-lateral-movement/requirements.txt
            --requirements modules/06-cloud-exfil/requirements.txt
            --requirements modules/07-ransomware-sim/requirements.txt
            --requirements dashboard/requirements.txt
            --requirements citef-config/requirements-validator.txt
            --requirements citef-config/requirements-controller.txt
          )

          mapfile -d '' -t collection_archives < <(
            find "$RUNNER_TEMP/ansible-collections" -maxdepth 1 -type f -name '*.tar.gz' -print0 | sort -z
          )
          if [[ "${#collection_archives[@]}" -eq 0 ]]; then
            echo "ansible-galaxy produced no collection archives" >&2
            exit 1
          fi
          for archive in "${collection_archives[@]}"; do
            requirements+=(--ansible-collection-archive "$archive")
          done

          output="offline-bundles/netstrike-${DESTINATION}-${RUN_ID}.tar.gz"
          python scripts/offline_bundle.py build \
            "${requirements[@]}" \
            --python-runtime-archive "$RUNNER_TEMP/python-runtime.tar.gz" \
            --output "$output"

      - name: Verify checksums and offline installation
        env:
          RUN_ID: ${{ github.run_id }}
        run: python scripts/offline_bundle.py verify "offline-bundles/netstrike-${DESTINATION}-${RUN_ID}.tar.gz"

      - name: Smoke full play from the actual bundle with kernel networking isolated
        env:
          RUN_ID: ${{ github.run_id }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/offline-bundles/netstrike-${DESTINATION}-${RUN_ID}.tar.gz"
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          host_namespace="$(readlink /proc/self/ns/net)"
          # Only setup runs as root. All installs/application execution run as
          # the runner user, with no capabilities, no privilege regain and lo only.
          sudo /usr/bin/unshare --net -- /bin/sh -eu -c '
            ip link set lo up
            exec /usr/bin/setpriv --reuid "$1" --regid "$2" --clear-groups \
              --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
              "$3" -I -B "$4" --archive "$5" --output "$6" \
              --expect-revision "$7" --expect-archive-sha256 "$8" \
              --host-network-namespace "$9" --execute
          ' offline-smoke "$(id -u)" "$(id -g)" "$(command -v python)" \
            "$GITHUB_WORKSPACE/scripts/offline_smoke.py" "$archive" \
            "$RUNNER_TEMP/offline-fullplay-smoke" "$EXPECTED_REVISION" "$archive_sha" "$host_namespace"

      - name: Retain bounded synthetic smoke evidence (not range acceptance)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: offline-fullplay-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/offline-fullplay-smoke/smoke-summary.json
            ${{ runner.temp }}/offline-fullplay-smoke/network-boundary.json
            ${{ runner.temp }}/offline-fullplay-smoke/application-smoke.json
            ${{ runner.temp }}/offline-fullplay-smoke/release-source.json
            ${{ runner.temp }}/offline-fullplay-smoke/preflight.json
            ${{ runner.temp }}/offline-fullplay-smoke/http-checks.json
            ${{ runner.temp }}/offline-fullplay-smoke/run-review-bundle.json
            ${{ runner.temp }}/offline-fullplay-smoke/events.jsonl
            ${{ runner.temp }}/offline-fullplay-smoke/canonical-events.jsonl
            ${{ runner.temp }}/offline-fullplay-smoke/learner-audit.jsonl
            ${{ runner.temp }}/offline-fullplay-smoke/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload offline bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: netstrike-offline-bundle-${{ env.DESTINATION }}-${{ github.run_id }}
          path: offline-bundles/netstrike-${{ env.DESTINATION }}-${{ github.run_id }}.tar.gz
          if-no-files-found: error
          retention-days: 14
