name: Lint and Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  event-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.11'

      - name: Install event-contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r shared/requirements.txt pytest coverage

      - name: Validate the shared event contract
        run: |
          coverage run --source=shared -m pytest shared/tests/ -v
          coverage report -m

  module-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        module:
          - modules/01-osint-profiler
          - modules/02-phishing-infra
          - modules/03-vishing-scripts
          - modules/04-mfa-fatigue-sim
          - modules/05-lateral-movement
          - modules/06-cloud-exfil
          - modules/07-ransomware-sim
          - orchestrator
          - dashboard
          - detection
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.11'

      - name: Install global tooling
        run: |
          python -m pip install --upgrade pip
          pip install pylint pytest coverage

      - name: Install module requirements (if present)
        run: |
          if [ -f "${{ matrix.module }}/requirements.txt" ]; then
            pip install -r "${{ matrix.module }}/requirements.txt"
          fi

      - name: Lint module
        continue-on-error: true
        run: |
          pylint "${{ matrix.module }}/" \
            --ignore=__pycache__,output \
            --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring,import-error \
            --fail-under=7.0

      - name: Inspect module tests and report destination
        id: module-tests
        env:
          MODULE_PATH: ${{ matrix.module }}
        run: |
          set -euo pipefail
          module="$MODULE_PATH"
          name="$(basename "$module")"
          report_root="$RUNNER_TEMP/module-coverage/$name"
          printf 'name=%s\nreport_root=%s\n' "$name" "$report_root" >> "$GITHUB_OUTPUT"
          if [ -d "$module/tests" ]; then
            printf 'has_tests=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_tests=false\n' >> "$GITHUB_OUTPUT"
            echo "No tests for $module; no test-validation or coverage claim."
          fi

      - name: Run module tests and preserve coverage (strict)
        if: steps.module-tests.outputs.has_tests == 'true'
        env:
          MODULE_PATH: ${{ matrix.module }}
          REPORT_ROOT: ${{ steps.module-tests.outputs.report_root }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_ROOT"
          cd "$MODULE_PATH"
          export COVERAGE_FILE="$REPORT_ROOT/.coverage"
          # Collect reports even after a test failure, then preserve every status.
          set +e
          python -m coverage run -m pytest tests/ -v
          test_status=$?
          python -m coverage report -m > "$REPORT_ROOT/coverage.txt"
          report_status=$?
          python -m coverage html -d "$REPORT_ROOT/html"
          html_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          if [ "$report_status" -ne 0 ]; then exit "$report_status"; fi
          exit "$html_status"

      - name: Upload txt coverage report
        if: always() && steps.module-tests.outputs.has_tests == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: coverage-txt-${{ steps.module-tests.outputs.name }}
          path: ${{ steps.module-tests.outputs.report_root }}/coverage.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload HTML coverage report
        if: always() && steps.module-tests.outputs.has_tests == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: coverage-html-${{ steps.module-tests.outputs.name }}
          path: ${{ steps.module-tests.outputs.report_root }}/html/
          if-no-files-found: error
          retention-days: 14
