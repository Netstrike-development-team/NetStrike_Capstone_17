name: Local full-play rehearsal

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  full-play-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local service and test dependencies
        run: python -m pip install -r dashboard/requirements.txt pytest
      - name: Test rehearsal and offline report tooling
        run: python -m pytest scripts/tests/test_rehearsal.py scripts/tests/test_generate_aar.py -q
      - name: Run all local checkpoint combinations and fault/control cases
        run: python scripts/rehearsal.py --execute --output "$RUNNER_TEMP/local-rehearsal-evidence"
      - name: Independently verify exported evidence offline
        run: python scripts/rehearsal.py --verify "$RUNNER_TEMP/local-rehearsal-evidence"
      - name: Retain synthetic developer evidence (not range sign-off)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-full-play-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/local-rehearsal-evidence/
          if-no-files-found: warn
          retention-days: 14
