name: Security Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install bandit==1.9.4

      - name: Legacy module security report (informational, not the release gate)
        continue-on-error: true
        # -ll = medium and high severity only (skips low/informational)
        # -x  = exclude test files (B101 assert_used is expected in tests)
        run: |
          bandit -r modules/ \
            -x "*/tests/*,*/__pycache__/*" \
            -ll \
            -o bandit_report.txt \
            -f txt

      - name: Strict maintained application security scan
        run: |
          set -e
          python -m bandit -r dashboard orchestrator shared scripts \
            -x /tests/,/__pycache__/ -ll -f json -o application-security.json
          python scripts/check_security_report.py application-security.json

      - name: Strict maintained profile and action adapter security scan
        run: |
          set -e
          python -m bandit \
            modules/01-osint-profiler/exercise_profiles.py \
            modules/04-mfa-fatigue-sim/identity_actions.py \
            modules/05-lateral-movement/endpoint_actions.py \
            modules/06-cloud-exfil/cloud_actions.py \
            modules/07-ransomware-sim/impact_actions.py \
            -ll -f json -o adapter-security.json
          python scripts/check_security_report.py adapter-security.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            bandit_report.txt
            application-security.json
            adapter-security.json
          if-no-files-found: warn
          retention-days: 14
